<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Student Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-brand">
            <h2>EduManage</h2>
        </div>
        <nav class="sidebar-nav">
            <a href="/index.html" class="active">Dashboard</a>
            <a href="/students.html">Students</a>
            <a href="/add-student.html">Add Student</a>
        </nav>
    </aside>

    <main class="main-content">
        <div class="page-header">
            <h1 class="page-title">Dashboard</h1>
        </div>

        <div id="alert" class="alert"></div>

        <div class="stats-grid animate-fade-in">
            <div class="card stat-card">
                <span class="stat-title">Total Students</span>
                <span class="stat-value" id="total-students">-</span>
            </div>
            <div class="card stat-card">
                <span class="stat-title">Male Students</span>
                <span class="stat-value" id="male-students">-</span>
            </div>
            <div class="card stat-card">
                <span class="stat-title">Female Students</span>
                <span class="stat-value" id="female-students">-</span>
            </div>
            <div class="card stat-card">
                <span class="stat-title">Average CGPA</span>
                <span class="stat-value" id="avg-cgpa">-</span>
            </div>
        </div>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/dashboard.js"></script>
</body>
</html>
