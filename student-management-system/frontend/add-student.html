<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student - Student Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-brand">
            <h2>EduManage</h2>
        </div>
        <nav class="sidebar-nav">
            <a href="/index.html">Dashboard</a>
            <a href="/students.html">Students</a>
            <a href="/add-student.html" class="active">Add Student</a>
        </nav>
    </aside>

    <main class="main-content">
        <div class="page-header">
            <h1 class="page-title" id="page-title">Add Student</h1>
        </div>

        <div id="alert" class="alert"></div>

        <div class="card animate-fade-in" style="max-width: 600px;">
            <form id="student-form">
                <div class="form-group">
                    <label class="form-label" for="full_name">Full Name</label>
                    <input type="text" id="full_name" class="form-control" placeholder="Ali Khan" required minlength="3" maxlength="100">
                    <span class="error-text" id="error-full_name"></span>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" id="email" class="form-control" placeholder="ali@gmail.com" required>
                    <span class="error-text" id="error-email"></span>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="phone">Phone Number</label>
                    <input type="text" id="phone" class="form-control" placeholder="03001234567" required pattern="^\d{10,15}$">
                    <span class="error-text" id="error-phone"></span>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="gender">Gender</label>
                    <select id="gender" class="form-control" required>
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                    <span class="error-text" id="error-gender"></span>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="course">Course</label>
                    <input type="text" id="course" class="form-control" placeholder="BSCS" required>
                    <span class="error-text" id="error-course"></span>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="semester">Semester</label>
                    <input type="number" id="semester" class="form-control" min="1" max="12" required>
                    <span class="error-text" id="error-semester"></span>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="cgpa">CGPA</label>
                    <input type="number" id="cgpa" class="form-control" min="0" max="4" step="0.01" required>
                    <span class="error-text" id="error-cgpa"></span>
                </div>
                
                <button type="submit" class="btn btn-primary">Save Student</button>
                <a href="/students.html" class="btn btn-danger" style="margin-left: 1rem;">Cancel</a>
            </form>
        </div>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/add-student.js"></script>
</body>
</html>
